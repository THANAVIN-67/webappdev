<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Form</title>
</head>
<body>

  <h1 id="title">User Experience Survey</h1>

  <p id="description">Please fill out this short survey to help us improve our service.</p>

  <form id="survey-form">

    <!-- Name -->
    <label id="name-label" for="name">Your Name:</label>
    <input 
      id="name"
      type="text"
      placeholder="Enter your full name"
      required
    />

    <!-- Email -->
    <label id="email-label" for="email">Email Address:</label>
    <input 
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    />

    <!-- Number -->
    <label id="number-label" for="number">Age:</label>
    <input 
      id="number"
      type="number"
      placeholder="Enter your age"
      min="10"
      max="100"
    />

    <!-- Dropdown -->
    <label for="dropdown">Which option best describes you?</label>
    <select id="dropdown">
      <option value="student">Student</option>
      <option value="professional">Professional</option>
      <option value="other">Other</option>
    </select>

    <!-- Radio Buttons -->
    <p>How satisfied are you with our platform?</p>

    <label>
      <input type="radio" name="satisfaction" value="satisfied" />
      Satisfied
    </label>

    <label>
      <input type="radio" name="satisfaction" value="neutral" />
      Neutral
    </label>

    <label>
      <input type="radio" name="satisfaction" value="unsatisfied" />
      Unsatisfied
    </label>

    <!-- Checkboxes -->
    <p>What features do you want to see improved? (Select all that apply)</p>

    <label>
      <input type="checkbox" value="design" />
      Design
    </label>

    <label>
      <input type="checkbox" value="performance" />
      Performance
    </label>

    <label>
      <input type="checkbox" value="features" />
      New Features
    </label>

    <!-- Textarea -->
    <label for="comments">Additional Comments:</label>
    <textarea id="comments" rows="5" placeholder="Write your feedback here..."></textarea>

    <!-- Submit Button -->
    <button id="submit" type="submit">Submit</button>

  </form>

</body>
</html>
